plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.ogfa.nativeviews'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    api libs.lottie
    api libs.gif.drawable
    // Required only to compile font-resource loading. AndroidX remains owned by
    // the parent application and is intentionally not embedded in the fat AAR.
    compileOnly 'androidx.core:core:1.5.0'
}
